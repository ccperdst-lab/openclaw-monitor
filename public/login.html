<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 OpenClaw Monitor — 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* Animated background */
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a1a 0%,#0d1224 50%,#0a0a1a 100%);z-index:0}
.bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(83,216,251,0.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 30%,rgba(99,102,241,0.04) 0%,transparent 50%)}
/* Grid lines */
.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(83,216,251,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(83,216,251,0.04) 1px,transparent 1px);background-size:60px 60px}
/* Card */
.card{position:relative;z-index:10;width:100%;max-width:400px;background:rgba(13,13,35,0.95);border:1px solid rgba(83,216,251,0.15);border-radius:20px;padding:36px 36px 32px;box-shadow:0 24px 80px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);backdrop-filter:blur(20px)}
.logo{text-align:center;margin-bottom:28px}
.logo .icon{font-size:36px;display:block;margin-bottom:8px}
.logo h1{font-size:18px;color:#53d8fb;font-weight:700;letter-spacing:-0.3px}
.logo p{font-size:11px;color:#4b5563;margin-top:4px}
/* Tabs */
.tabs{display:flex;background:rgba(255,255,255,0.04);border-radius:8px;padding:3px;margin-bottom:24px}
.tab{flex:1;text-align:center;padding:7px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:#6b7280;transition:all .2s}
.tab.active{background:rgba(83,216,251,0.15);color:#53d8fb}
/* Form */
.form-panel{display:none}.form-panel.active{display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px}
.field input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(83,216,251,0.15);
  border-radius:9px;color:#e2e8f0;font-size:13px;outline:none;
  transition:all .2s;font-family:inherit;
}
.field input:focus{border-color:rgba(83,216,251,0.5);background:rgba(83,216,251,0.04);box-shadow:0 0 0 3px rgba(83,216,251,0.08)}
.field input::placeholder{color:#374151}
/* Button */
.submit-btn{
  width:100%;padding:12px;margin-top:6px;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  border:none;border-radius:9px;color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s;letter-spacing:0.3px;
  box-shadow:0 4px 16px rgba(59,130,246,0.3);
}
.submit-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(59,130,246,0.4)}
.submit-btn:active{transform:translateY(0)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
/* Error / info */
.msg{min-height:20px;text-align:center;font-size:11px;margin-top:10px}
.msg.error{color:#f87171}.msg.success{color:#34d399}.msg.info{color:#93c5fd}
/* Footer */
.footer{text-align:center;margin-top:20px;font-size:10px;color:#374151}
.footer a{color:#53d8fb;text-decoration:none}
.footer a:hover{text-decoration:underline}
/* First-time notice */
.notice{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);border-radius:8px;padding:10px 12px;font-size:11px;color:#34d399;margin-bottom:16px;display:none}
.notice.show{display:block}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>

<div class="card">
  <div class="logo">
    <span class="icon">🟢</span>
    <h1>OPENCLAW MONITOR</h1>
    <p>Real-time 3D Agent Dashboard</p>
  </div>

  <div id="first-notice" class="notice">
    👋 首次使用，请创建管理员账号
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
  </div>

  <!-- Login -->
  <div class="form-panel active" id="panel-login">
    <div class="field"><label>用户名</label><input id="l-username" placeholder="输入用户名" autocomplete="username" /></div>
    <div class="field"><label>密码</label><input id="l-password" type="password" placeholder="输入密码" autocomplete="current-password" /></div>
    <button class="submit-btn" id="login-btn" onclick="doLogin()">登 录</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- Register -->
  <div class="form-panel" id="panel-register">
    <div class="field"><label>用户名</label><input id="r-username" placeholder="设置用户名" autocomplete="username" /></div>
    <div class="field"><label>密码</label><input id="r-password" type="password" placeholder="至少6位" autocomplete="new-password" /></div>
    <div class="field"><label>确认密码</label><input id="r-confirm" type="password" placeholder="再次输入密码" /></div>
    <div class="field"><label>邮箱（可选）</label><input id="r-email" type="email" placeholder="your@email.com" /></div>
    <button class="submit-btn" id="reg-btn" onclick="doRegister()">注 册</button>
    <div class="msg" id="reg-msg"></div>
  </div>

  <div class="footer">
    <a href="/" style="color:#4b5563">← 返回主页</a>
  </div>
</div>

<script>
'use strict';
let isFirstUser = false;

async function init() {
  try {
    const r = await fetch('/api/auth/status');
    const d = await r.json();
    if (d.authenticated) {
      // Already logged in — redirect
      location.href = '/';
      return;
    }
    if (!d.hasUsers) {
      // First user — show register tab
      isFirstUser = true;
      document.getElementById('first-notice').classList.add('show');
      switchTab('register');
      // Disable login tab
      document.getElementById('tab-login').style.opacity = '0.3';
      document.getElementById('tab-login').style.pointerEvents = 'none';
    }
  } catch {}
}
init();

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

function setMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

function setLoading(btn, loading) {
  btn.disabled = loading;
  btn.textContent = loading ? '请稍候...' : (btn.id === 'login-btn' ? '登 录' : '注 册');
}

async function doLogin() {
  const username = document.getElementById('l-username').value.trim();
  const password = document.getElementById('l-password').value;
  const btn = document.getElementById('login-btn');
  if (!username || !password) { setMsg('login-msg', '请填写用户名和密码', 'error'); return; }
  setLoading(btn, true); setMsg('login-msg', '', '');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (r.ok) {
      setMsg('login-msg', '登录成功，跳转中...', 'success');
      setTimeout(() => { location.href = d.user?.role === 'admin' ? '/?from=login' : '/'; }, 600);
    } else {
      setMsg('login-msg', d.error || '登录失败', 'error');
    }
  } catch { setMsg('login-msg', '连接失败，请重试', 'error'); }
  setLoading(btn, false);
}

async function doRegister() {
  const username = document.getElementById('r-username').value.trim();
  const password = document.getElementById('r-password').value;
  const confirm  = document.getElementById('r-confirm').value;
  const email    = document.getElementById('r-email').value.trim();
  const btn = document.getElementById('reg-btn');

  if (!username || !password) { setMsg('reg-msg', '请填写用户名和密码', 'error'); return; }
  if (password.length < 6) { setMsg('reg-msg', '密码至少6位', 'error'); return; }
  if (password !== confirm) { setMsg('reg-msg', '两次密码不一致', 'error'); return; }

  setLoading(btn, true); setMsg('reg-msg', '', '');
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, email })
    });
    const d = await r.json();
    if (r.ok) {
      const msg = d.isFirst ? '管理员账号创建成功！' : '注册成功！';
      setMsg('reg-msg', msg + ' 跳转中...', 'success');
      setTimeout(() => { location.href = d.user?.role === 'admin' ? '/?from=register' : '/'; }, 800);
    } else {
      setMsg('reg-msg', d.error || '注册失败', 'error');
    }
  } catch { setMsg('reg-msg', '连接失败，请重试', 'error'); }
  setLoading(btn, false);
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.form-panel.active');
  if (active.id === 'panel-login') doLogin();
  else doRegister();
});
</script>
</body>
</html>
