<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🟢 OpenClaw Monitor 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a1a;color:#e0e0e0;font-family:'Press Start 2P',monospace;overflow:hidden;height:100vh;user-select:none}
  #scene3d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
  #scene3d canvas{cursor:grab}
  #scene3d canvas.dragging{cursor:grabbing}

  /* Drawer */
  #drawer{position:fixed;top:0;left:0;height:100vh;width:360px;background:rgba(8,8,24,0.93);backdrop-filter:blur(16px);border-right:2px solid rgba(83,216,251,0.2);z-index:100;transform:translateX(0);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;box-shadow:6px 0 40px rgba(0,0,0,0.6)}
  #drawer.shut{transform:translateX(-360px)}
  #drawer:not(.shut)~#toggle{left:368px}
  #toggle{position:fixed;top:14px;left:14px;z-index:101;width:40px;height:40px;border:2px solid #53d8fb;background:rgba(8,8,24,0.9);backdrop-filter:blur(8px);color:#53d8fb;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px}
  .dh{padding:18px 14px;border-bottom:1px solid rgba(83,216,251,0.12);text-align:center}
  .dh h1{font-size:13px;color:#53d8fb}.dh .sub{font-size:7px;color:#556;margin-top:5px}
  .db{flex:1;overflow-y:auto;padding:8px}.db::-webkit-scrollbar{width:5px}.db::-webkit-scrollbar-thumb{background:#0f3460}
  .sec{margin-bottom:8px;background:rgba(15,52,96,0.12);border-radius:6px;overflow:hidden}
  .sec-h{font-size:8px;color:#53d8fb;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .sec-h:hover{background:rgba(15,52,96,0.35)}
  .sec.off .sec-b{display:none}.sec.off .arr{transform:rotate(-90deg)}.arr{transition:transform 0.2s;font-size:9px}
  .sec-b{padding:4px 6px 8px}
  .row{font-size:8px;padding:5px 6px;margin-bottom:2px;background:rgba(0,0,0,0.2);border-radius:4px;display:flex;justify-content:space-between;align-items:center}
  .dot{width:7px;height:7px;margin-right:5px;display:inline-block;border-radius:1px}.dot.on{background:#4ade80;box-shadow:0 0 6px #4ade80}.dot.off{background:#ef4444}
  .log{font-size:7px;padding:4px 6px;margin-bottom:2px;border-left:3px solid #0f3460;background:rgba(0,0,0,0.15);border-radius:0 3px 3px 0;font-family:monospace;line-height:1.5;user-select:text;cursor:text}
  .log.t_user_msg{border-color:#34d399}.log.t_thinking{border-color:#a78bfa}.log.t_tool_use{border-color:#f97316}.log.t_tool_result{border-color:#f59e0b}.log.t_reply_text{border-color:#60a5fa}.log.t_reply_intermediate{border-color:#93c5fd}
  .cmd-input{width:100%;padding:6px 8px;background:rgba(15,52,96,0.3);border:1px solid rgba(83,216,251,0.2);border-radius:4px;color:#53d8fb;font-family:monospace;font-size:8px;outline:none}
  .cmd-result{margin-top:5px;padding:5px 6px;background:rgba(0,0,0,0.3);border-radius:4px;font-family:monospace;font-size:7px;color:#889;max-height:100px;overflow-y:auto;white-space:pre-wrap;display:none}
  #hud{position:fixed;top:12px;right:14px;z-index:90;display:flex;gap:6px}
  .hud{font-size:7px;padding:4px 10px;border-radius:12px;background:rgba(8,8,24,0.85);border:1px solid rgba(83,216,251,0.2);backdrop-filter:blur(6px);color:#889}
  .hud .hd{width:6px;height:6px;display:inline-block;margin-right:4px;background:#4ade80;box-shadow:0 0 4px #4ade80;border-radius:1px}
  #help{position:fixed;bottom:10px;right:14px;z-index:90;font-size:6px;color:#334;text-align:right;line-height:1.8}

  /* Speech Bubble */
  .bubble3d{
    position:fixed;z-index:80;
    background:#fff;border-radius:12px;
    min-width:260px;max-width:320px;
    box-shadow:0 12px 40px rgba(0,0,0,0.14),0 3px 10px rgba(0,0,0,0.07);
    pointer-events:auto;
    opacity:0;transform:translateY(10px) scale(0.96);
    transition:opacity .2s ease,transform .2s ease;
    border:1px solid rgba(0,0,0,0.06);
    border-left:4px solid #94a3b8;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .bubble3d.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .bubble3d:not(.show){pointer-events:none}
  .bubble3d::after{
    content:'';position:absolute;top:100%;left:28px;
    border:8px solid transparent;border-top-color:#fff;
    pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.08));
  }
  .bubble3d.s-think{border-left-color:#f59e0b}
  .bubble3d.s-stream{border-left-color:#3b82f6}
  .bubble3d.s-done{border-left-color:#10b981}
  .bubble3d.s-error{border-left-color:#ef4444}
  .bub-hd{display:flex;align-items:center;gap:6px;padding:9px 11px 8px;border-bottom:1px solid #f3f4f6;background:#fafafa}
  .bub-avatar{font-size:13px;flex-shrink:0}
  .bub-user{flex:1;font-size:12px;font-weight:700;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bub-close{background:none;border:none;cursor:pointer;color:#bbb;font-size:16px;font-weight:300;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;flex-shrink:0;line-height:1}
  .bub-close:hover{background:#f3f4f6;color:#555}
  .bub-pin{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px;transition:background .15s;flex-shrink:0;opacity:0.5}
  .bub-pin:hover{background:#f3f4f6;opacity:1}
  .bub-msg{padding:9px 13px 7px;font-size:12px;color:#1f2937;line-height:1.6;word-break:break-word;max-height:100px;overflow-y:auto;border-bottom:1px solid #f3f4f6}
  .bub-msg::-webkit-scrollbar{width:3px}.bub-msg::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
  .bub-acts{border-bottom:1px solid #f3f4f6}
  .bub-acts-hd{display:flex;align-items:center;gap:5px;padding:5px 13px;cursor:pointer;font-size:10px;color:#6b7280;transition:background .12s;user-select:none}
  .bub-acts-hd:hover{background:#f9fafb}
  .bub-acts-tri{font-size:8px;color:#9ca3af;transition:transform .18s;display:inline-block}
  .bub-acts.collapsed .bub-acts-tri{transform:rotate(0deg)}
  .bub-acts:not(.collapsed) .bub-acts-tri{transform:rotate(90deg)}
  .bub-acts-lbl{flex:1;font-weight:600;font-size:10px;color:#4b5563}
  .bub-acts-cnt{background:#e5e7eb;color:#374151;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700}
  .bub-acts.collapsed .bub-acts-body{display:none}
  .bub-acts-body{max-height:140px;overflow-y:auto;padding:2px 0 5px}
  .bub-acts-body::-webkit-scrollbar{width:3px}
  .bub-acts-body::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px}
  .bact{display:flex;gap:6px;align-items:flex-start;padding:3px 13px;font-size:10px;line-height:1.4;color:#374151;transition:background .1s}
  .bact:hover{background:#f9fafb}
  .bact>span:first-child{flex-shrink:0;font-size:11px;margin-top:1px}
  .bact-think{color:#6d28d9}
  .bact-tool{color:#b45309}
  .bact-tool em{color:#9ca3af;font-style:normal;font-size:9px}
  .bact-result{color:#059669}
  .bact-reply{color:#1d4ed8}
  .bact-final{font-weight:600}
  .bact-divider{text-align:center;padding:6px 13px 4px;font-size:9px;color:#9ca3af;letter-spacing:0.5px}
  .bact-divider span{background:#f9fafb;padding:0 8px;border-radius:8px}
  .bact-more{font-size:9px;color:#9ca3af;padding:2px 13px}
  .bub-chat{padding:4px 10px 6px;border-top:1px solid #f3f4f6}
  .bub-chat-in{width:100%;padding:5px 8px;font-size:11px;border:1px solid #e5e7eb;border-radius:6px;outline:none;font-family:inherit;box-sizing:border-box}
  .bub-chat-in:focus{border-color:#93c5fd;box-shadow:0 0 0 2px rgba(59,130,246,0.15)}
  .bub-foot{padding:6px 13px 8px;font-size:10px;color:#6b7280;line-height:1.5;min-height:26px}
  .bubble3d.s-think .bub-foot{color:#92400e}
  .bubble3d.s-stream .bub-foot{color:#1e40af}
  .bubble3d.s-done .bub-foot{color:#065f46}
  .bubble3d.s-error .bub-foot{color:#991b1b}

  /* MCP Speech Bubble */
  .mcp-bubble{
    position:fixed;z-index:85;
    background:linear-gradient(135deg,#1e1b4b,#312e81);
    border:2px solid rgba(139,92,246,0.6);
    border-radius:14px;
    min-width:140px;max-width:280px;
    box-shadow:0 8px 32px rgba(99,40,180,0.4),0 0 30px rgba(139,92,246,0.2),0 0 60px rgba(139,92,246,0.1);
    pointer-events:none;
    opacity:1;
    transform:translateY(0) scale(1);
    transition:opacity .3s ease,transform .3s ease;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    animation: mcp-glow 1.5s ease-in-out infinite alternate;
  }
  @keyframes mcp-glow {
    from { box-shadow: 0 8px 32px rgba(99,40,180,0.4), 0 0 30px rgba(139,92,246,0.2); border-color: rgba(139,92,246,0.6); }
    to { box-shadow: 0 8px 32px rgba(99,40,180,0.6), 0 0 50px rgba(139,92,246,0.35); border-color: rgba(167,139,250,0.9); }
  }
  .mcp-bubble::after{
    content:'';position:absolute;top:100%;left:30px;
    border:8px solid transparent;border-top-color:#312e81;
    pointer-events:none;
  }
  .mcp-bub-hd{
    padding:8px 14px 5px;
    font-size:11px;font-weight:700;
    color:#c4b5fd;
    border-bottom:1px solid rgba(139,92,246,0.25);
    letter-spacing:0.3px;
  }
  .mcp-bub-text{
    padding:10px 14px 12px;
    font-size:13px;
    color:#e0e7ff;
    line-height:1.6;
    word-break:break-word;
  }

  /* Notification Box */
  .notify-box{
    position:fixed;right:14px;z-index:92;
    width:260px;
    background:rgba(15,15,35,0.92);backdrop-filter:blur(10px);
    border:1px solid rgba(83,216,251,0.2);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
    cursor:pointer;
    opacity:0;transform:translateX(100%);
    transition:opacity .3s,transform .3s;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .notify-box.show{opacity:1;transform:translateX(0)}
  .notify-box:hover{border-color:rgba(83,216,251,0.5);box-shadow:0 6px 24px rgba(0,0,0,0.4)}
  .nb-hd{display:flex;align-items:center;gap:5px;padding:7px 10px 4px}
  .nb-icon{font-size:12px;flex-shrink:0}
  .nb-name{font-size:10px;font-weight:700;color:#53d8fb;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nb-user{font-size:9px;color:#666;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nb-close{background:none;border:none;color:#555;font-size:12px;cursor:pointer;padding:0 2px;border-radius:3px;flex-shrink:0}
  .nb-close:hover{color:#fff;background:rgba(255,255,255,0.1)}
  .nb-msg{padding:2px 10px 6px;font-size:10px;color:#aaa;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .nb-bar{height:2px;background:rgba(83,216,251,0.1)}
  .nb-bar-fill{height:100%;background:rgba(83,216,251,0.5);width:100%}

  /* Fixed Bottom Panel */
  #fixed-panel{
    position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:95;
    width:min(520px, 85vw);max-height:45vh;
    background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);
    border-radius:16px;
    box-shadow:0 8px 40px rgba(0,0,0,0.12),0 2px 10px rgba(0,0,0,0.06);
    border:1px solid rgba(0,0,0,0.08);
    display:flex;flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
    transition:box-shadow .2s;
  }
  #fixed-panel:hover{box-shadow:0 12px 48px rgba(0,0,0,0.16),0 4px 14px rgba(0,0,0,0.08)}
  .fp-hd{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid #f0f0f0;background:rgba(250,250,250,0.9)}
  .fp-avatar{font-size:14px;flex-shrink:0}
  .fp-user{flex:1;font-size:12px;font-weight:700;color:#1a1a2e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fp-unpin{background:none;border:none;cursor:pointer;font-size:12px;padding:3px 6px;border-radius:6px;opacity:0.4;transition:all .15s}
  .fp-unpin:hover{opacity:1;background:#e8e8e8}
  .fp-close{background:none;border:none;cursor:pointer;color:#bbb;font-size:15px;font-weight:300;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .fp-close:hover{background:#f0f0f0;color:#555}
  .fp-body{flex:1;overflow-y:auto;padding:0}
  .fp-msg{padding:8px 14px 6px;font-size:12px;color:#1f2937;line-height:1.5;max-height:60px;overflow-y:auto;border-bottom:1px solid #f5f5f5}
  .fp-acts{border-bottom:1px solid #f5f5f5}
  .fp-acts-hd{display:flex;align-items:center;gap:5px;padding:5px 14px;cursor:pointer;font-size:9px;color:#888;transition:background .12s}
  .fp-acts-hd:hover{background:#f9f9f9}
  .fp-acts-tri{font-size:7px;color:#aaa;display:inline-block;transition:transform .18s}
  .fp-acts.collapsed .fp-acts-tri{transform:rotate(0deg)}
  .fp-acts:not(.collapsed) .fp-acts-tri{transform:rotate(90deg)}
  .fp-acts-lbl{flex:1;font-weight:600;font-size:9px;color:#666}
  .fp-acts-cnt{background:#eee;color:#555;border-radius:8px;padding:1px 5px;font-size:8px;font-weight:700}
  .fp-acts.collapsed .fp-acts-body{display:none}
  .fp-acts-body{max-height:160px;overflow-y:auto;padding:2px 0 4px}
  .fp-chat{padding:5px 12px 6px;border-top:1px solid #f0f0f0}
  .fp-chat-in{width:100%;padding:6px 10px;font-size:11px;border:1px solid #e5e7eb;border-radius:8px;outline:none;font-family:inherit;box-sizing:border-box;background:#fafafa;transition:border-color .15s}
  .fp-chat-in:focus{border-color:#93c5fd;box-shadow:0 0 0 2px rgba(59,130,246,0.12);background:#fff}
  .fp-foot{padding:5px 14px 8px;font-size:9px;color:#999;line-height:1.4}

  /* Loading Overlay */
  #loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,26,0.97);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease}
  #loading-overlay.hidden{opacity:0;pointer-events:none}
  .loading-content{text-align:center}
  .loading-spinner{width:48px;height:48px;border:4px solid rgba(83,216,251,0.2);border-top-color:#53d8fb;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:11px;color:#53d8fb;letter-spacing:1px}

  /* Hover Tooltip */
  #hover-tooltip{position:fixed;z-index:88;background:rgba(8,8,24,0.92);color:#e0e0e0;padding:8px 12px;border-radius:8px;font-size:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;pointer-events:none;border:1px solid rgba(83,216,251,0.2);box-shadow:0 4px 16px rgba(0,0,0,0.4);line-height:1.6;max-width:220px;transition:opacity 0.15s}
  #hover-tooltip.hidden{opacity:0}
  .tt-name{color:#ffd700;font-weight:700;font-size:11px}
  .tt-type{color:#93c5fd}
  .tt-state{font-weight:600}

  /* Detail Popup */
  #detail-popup{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;
    background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #detail-popup.show{display:flex}
  .dp-card{
    position:relative;
    max-width:500px;width:90vw;max-height:60vh;
    background:#fff;border-radius:14px;
    box-shadow:0 16px 56px rgba(0,0,0,0.25);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .dp-body{
    padding:18px 20px;overflow-y:auto;flex:1;
    font-size:13px;color:#1f2937;line-height:1.7;word-break:break-word;
  }
  .dp-body::-webkit-scrollbar{width:4px}
  .dp-body::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
  .dp-body pre{background:#f3f4f6;padding:10px 12px;border-radius:6px;overflow-x:auto;font-size:12px;line-height:1.5;margin:6px 0}
  .dp-body code{font-family:'SF Mono',Consolas,monospace;font-size:12px}
  .dp-body code.inline-code{background:#f3f4f6;padding:1px 5px;border-radius:3px;font-size:11px}
  .dp-body .md-h{display:block;margin:8px 0 4px;font-size:14px}
  .dp-body ul{padding-left:20px;margin:4px 0}
  .dp-body li{margin:2px 0}
  .dp-close{
    position:absolute;top:10px;right:10px;
    background:rgba(0,0,0,0.06);border:none;cursor:pointer;
    color:#888;font-size:16px;width:28px;height:28px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;z-index:1;
  }
  .dp-close:hover{background:rgba(0,0,0,0.12);color:#333}

  /* Feature 2: World Chat Panel */
  #chat-panel{
    position:fixed;bottom:14px;left:14px;z-index:93;
    width:300px;max-height:40vh;
    background:rgba(8,8,24,0.92);backdrop-filter:blur(12px);
    border:1px solid rgba(83,216,251,0.2);
    border-radius:12px;
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
    display:none;flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
  }
  #chat-panel.show{display:flex}
  #chat-panel .cp-hd{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(83,216,251,0.12)}
  #chat-panel .cp-hd span{font-size:11px;font-weight:700;color:#53d8fb;flex:1}
  #chat-panel .cp-hd button{background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
  #chat-panel .cp-hd button:hover{color:#fff;background:rgba(255,255,255,0.1)}
  #chat-panel .cp-msgs{flex:1;overflow-y:auto;padding:6px 0;min-height:80px;max-height:30vh}
  #chat-panel .cp-msgs::-webkit-scrollbar{width:4px}
  #chat-panel .cp-msgs::-webkit-scrollbar-thumb{background:rgba(83,216,251,0.2);border-radius:2px}
  .cp-msg{padding:4px 12px;font-size:11px;line-height:1.5}
  .cp-msg .cp-name{font-weight:700;margin-right:4px}
  .cp-msg .cp-text{color:#ccc}
  .cp-msg.system{font-style:italic;color:#666;font-size:10px}
  #chat-panel .cp-input{display:flex;padding:6px 8px;border-top:1px solid rgba(83,216,251,0.12);gap:4px}
  #chat-panel .cp-input input{flex:1;padding:5px 8px;font-size:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(83,216,251,0.15);border-radius:6px;color:#e0e0e0;outline:none;font-family:inherit}
  #chat-panel .cp-input input:focus{border-color:rgba(83,216,251,0.4)}
  #chat-panel .cp-input button{padding:5px 10px;font-size:10px;background:rgba(83,216,251,0.15);border:1px solid rgba(83,216,251,0.3);border-radius:6px;color:#53d8fb;cursor:pointer;font-family:inherit}
  #chat-panel .cp-input button:hover{background:rgba(83,216,251,0.25)}

  /* Feature 3: Login Overlay */
  #login-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;
    background:rgba(10,10,26,0.97);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #login-overlay.show{display:flex}
  .login-card{
    text-align:center;padding:36px 40px;
    background:rgba(15,15,35,0.95);
    border:1px solid rgba(83,216,251,0.2);
    border-radius:16px;
    box-shadow:0 8px 40px rgba(0,0,0,0.5);
    min-width:300px;
  }
  .login-card h2{font-size:16px;color:#53d8fb;margin-bottom:8px;font-family:'Press Start 2P',monospace}
  .login-card p{font-size:12px;color:#888;margin-bottom:20px}
  .login-card input{
    width:100%;padding:10px 14px;font-size:16px;text-align:center;letter-spacing:6px;
    background:rgba(255,255,255,0.06);border:2px solid rgba(83,216,251,0.3);
    border-radius:8px;color:#53d8fb;outline:none;font-family:monospace;margin-bottom:12px;box-sizing:border-box;
  }
  .login-card input:focus{border-color:#53d8fb;box-shadow:0 0 0 3px rgba(83,216,251,0.15)}
  .login-card button{
    width:100%;padding:10px;font-size:12px;font-weight:700;
    background:rgba(83,216,251,0.2);border:1px solid rgba(83,216,251,0.4);
    border-radius:8px;color:#53d8fb;cursor:pointer;font-family:'Press Start 2P',monospace;letter-spacing:1px;
  }
  .login-card button:hover{background:rgba(83,216,251,0.3)}

</head>
<body>
<div id="scene3d"></div>
<div id="hud">
  <div class="hud"><span class="hd"></span>Online</div>
  <div class="hud" id="h-agents">Agents: 0</div>
  <div class="hud" id="h-sess">Sessions: 0</div>
</div>
<div id="drawer">
  <div class="dh"><h1>🟢 OPENCLAW 3D</h1><div class="sub">Agent Monitor — Direct FS</div></div>
  <div class="db">
    <div class="sec" id="sec-agents"><div class="sec-h">🏠 Agents <span class="arr">▼</span></div><div class="sec-b" id="b-agents"></div></div>
    <div class="sec" id="sec-sessions"><div class="sec-h">📡 Sessions <span class="arr">▼</span></div><div class="sec-b"><input class="cmd-input" id="session-search" placeholder="🔍 搜索会话..." style="margin-bottom:6px" /><div id="b-sessions"></div></div></div>
    <div class="sec" id="sec-logs"><div class="sec-h">📋 Events <span class="arr">▼</span></div><div class="sec-b" id="b-logs" style="max-height:260px;overflow-y:auto"></div></div>
    <div class="sec" id="sec-cli"><div class="sec-h">⌨️ CLI <span class="arr">▼</span></div><div class="sec-b">
      <input class="cmd-input" id="cmd-in" placeholder="openclaw status ..." />
      <div class="cmd-result" id="cmd-out"></div>
    </div></div>
  </div>
</div>
<button id="toggle">☰</button>
<canvas id="minimap" width="200" height="200" style="position:fixed;bottom:14px;right:14px;z-index:90;background:rgba(8,8,24,0.75);border:2px solid rgba(83,216,251,0.3);border-radius:6px;cursor:pointer"></canvas>
<div id="fps-badge" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;font-size:7px;padding:3px 10px;border-radius:10px;background:rgba(8,8,24,0.7);border:1px solid rgba(83,216,251,0.15);color:#889;font-family:monospace;pointer-events:none">-- FPS</div>
<div id="help">WASD 移动 · 鼠标拖拽转向 · 滚轮缩放 · 点击小黄人查看详情 · 双击跟踪 · R 下雨 · V 第三人称 · T 聊天 · F1 截图 · 1-9 跳转大洲</div>
<div id="chat-panel">
  <div class="cp-hd"><span>💬 世界聊天</span><button id="chat-close">✕</button></div>
  <div class="cp-msgs" id="chat-msgs"></div>
  <div class="cp-input"><input id="chat-input" placeholder="输入消息..." /><button id="chat-send">发送</button></div>
</div>
<div id="login-overlay">
  <div class="login-card">
    <h2>🔐 AUTH</h2>
    <p>请输入访问令牌</p>
    <input id="login-token" type="text" maxlength="6" autocomplete="off" />
    <button id="login-btn">验证</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="loading-overlay">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text">🟢 Loading OpenClaw Monitor...</div>
  </div>
</div>
<script type="module" src="/bundle.js"></script>
</body>
</html>
