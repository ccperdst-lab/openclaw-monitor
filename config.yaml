openclawRoot: ~/.openclaw

server:
  port: 7777
  host: 0.0.0.0

display:
  showCron: true
  showSubagent: true
  recentMinutes: 10  # only show thinking/tool messages from last N minutes in bubble

mcp:
  enabled: true
  port: 7777  # MCP server uses the same monitor server for API calls

auth:
  enabled: false  # set true to require token auth
